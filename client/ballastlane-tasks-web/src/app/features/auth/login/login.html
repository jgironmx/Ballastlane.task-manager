<section class="auth-card">
  <h1>Sign in</h1>

  @if (isDevelopment) {
    <p class="demo-hint">
      Development demo account: <code>demo@ballastlane.local</code> / <code>Demo1234!</code>
    </p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-describedby]="form.controls.email.invalid && form.controls.email.touched ? 'login-email-error' : null"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      <app-field-error
        id="login-email-error"
        [message]="
          form.controls.email.touched && form.controls.email.hasError('required')
            ? 'Email is required.'
            : form.controls.email.touched && form.controls.email.hasError('email')
              ? 'Enter a valid email address.'
              : null
        "
      />
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-describedby]="form.controls.password.invalid && form.controls.password.touched ? 'login-password-error' : null"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <app-field-error
        id="login-password-error"
        [message]="form.controls.password.touched && form.controls.password.hasError('required') ? 'Password is required.' : null"
      />
    </div>

    @if (errorMessage(); as message) {
      <p class="server-error" role="alert">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch-link">Don't have an account? <a routerLink="/register">Register</a></p>
</section>
