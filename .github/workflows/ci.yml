name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit/architecture tests (.NET, Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ballastlane.Tasks.sln

      - name: Build (Release)
        run: dotnet build Ballastlane.Tasks.sln --no-restore --configuration Release

      # Domain, Application, and Architecture tests are fully in-memory — no SQL Server LocalDB
      # required — so they run cross-platform on Linux. Infrastructure/Api integration tests use
      # SQL Server LocalDB, which is Windows-only; they run in the backend-integration job below.
      - name: Test (Release) - unit and architecture only
        run: >
          dotnet test Ballastlane.Tasks.sln --no-build --configuration Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Verify code formatting
        run: dotnet format --verify-no-changes

      - name: Check for vulnerable NuGet packages
        run: dotnet list package --vulnerable --include-transitive

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-unit-test-results
          path: ./TestResults

  backend-integration:
    name: Backend integration tests (.NET, Windows + LocalDB)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ballastlane.Tasks.sln

      - name: Build (Release)
        run: dotnet build Ballastlane.Tasks.sln --no-restore --configuration Release

      # windows-latest ships SQL Server Express LocalDB pre-installed; the default MSSQLLocalDB
      # instance is started on demand, but we start it explicitly for a faster, clearer failure
      # if that assumption ever stops holding.
      - name: Start SQL Server LocalDB
        run: SqlLocalDB start MSSQLLocalDB

      - name: Test (Release) - integration only
        run: >
          dotnet test Ballastlane.Tasks.sln --no-build --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-integration-test-results
          path: ./TestResults

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/ballastlane-tasks-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: client/ballastlane-tasks-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build
